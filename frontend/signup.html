<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | JananiMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6c3cff, #ff4f81);
            padding: 25px 15px;
        }

        .signup-container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #6c3cff;
            margin-bottom: 8px;
        }

        .logo span {
            color: #ff4f81;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #29213d;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #6c3cff;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #6c3cff, #ff4f81);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-btn:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #6c3cff;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .signup-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">Janani<span>Mart</span></div>

        <p class="subtitle">Join us and start shopping!</p>

        <h2>Create Your Account</h2>

        <form id="signupForm">

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                       placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}"
                       title="Enter a 10-digit phone number"
                       required>
            </div>

            <div class="input-group">
                <label for="role">Account Type</label>
                <select id="role" required>
                    <option value="">Select account type</option>
                    <option value="customer">Customer</option>
                    <option value="seller">Seller</option>
                </select>
            </div>

            <div class="input-group">
                <label for="password">Create Password</label>
                <input type="password" id="password"
                       placeholder="At least 8 characters"
                       minlength="8" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter your password"
                       minlength="8" required>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

            <p class="message" id="message"></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script>
        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.style.color = "#d93025";
                message.textContent = "Passwords do not match!";
                return;
            }

            message.style.color = "#6c3cff";
            message.textContent =
                "Form validated! Account creation backend is not connected yet.";
        });
    </script>

</body>
</html>
